version: 2

sources:
  - name: GlobalMarket
    description: a clone of the Databricks Database
    database: udemy_bootcamp
    schema: raw
    tables:
      - name: customers
      - name: orders
        description: Raw orders table
        columns:
          - name: OrderID
            description: primiry key for orders
            tests:
              - unique
              - not_null              
      - name: product
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour
          loaded_at_field: loadedat
